name = "xcp-recovery-bootstrap"
main = "src/recovery/bootstrap-worker.ts"
compatibility_date = "2025-01-01"
minify = true
workers_dev = true
preview_urls = false

[limits]
cpu_ms = 300000

[[d1_databases]]
binding = "DB"
database_name = "xcpio"
database_id = "0aa317ef-600f-4908-b7e3-fb8df8c71104"
migrations_dir = "migrations"

[[d1_databases]]
binding = "RECOVERY_DB"
database_name = "xcpio-btc"
database_id = "9bc7626d-df95-49d2-a118-274cd1b34b2f"
migrations_dir = "migrations-recovery"

[[r2_buckets]]
binding = "RECOVERY_TRANSACTIONS"
bucket_name = "xcpio-bitcoin-transactions"

[vars]
ELECTRS_API_BASE = "https://api.counterparty.io:3000"
