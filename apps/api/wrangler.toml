name = "xcp-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
minify = true
workers_dev = true

[limits]
cpu_ms = 300000

[triggers]
crons = ["*/2 * * * *", "1-59/2 * * * *"]

# Canonical Counterparty database.
[[d1_databases]]
binding = "CORE_DB"
database_name = "xcpio-core"
database_id = "17b7d589-7076-4ea1-851a-0de10964ab16"
migrations_dir = "migrations-core"

# Counterparty bare-multisig recovery index. Isolated because its source is the
# Bitcoin chain, it is independently rebuildable, and the main D1 is near its cap.
[[d1_databases]]
binding = "RECOVERY_DB"
database_name = "xcpio-btc"
database_id = "9bc7626d-df95-49d2-a118-274cd1b34b2f"
migrations_dir = "migrations-recovery"

[[r2_buckets]]
binding = "RECOVERY_TRANSACTIONS"
bucket_name = "xcpio-bitcoin-transactions"

# worker-to-worker (avoids the workers.dev sibling-fetch issue) for swap market data
[[services]]
binding = "XCPDEX"
service = "xcpdex-api"

[vars]
COUNTERPARTY_API_BASE = "https://api.counterparty.io:4000/v2"
XCPDEX_API = "https://xcpdex-api.me-bbe.workers.dev"
CONSOLIDATION_API = "https://api.xcp.io"   # Hetzner consolidation svc (today api.xcp.io; switch to a grey-cloud origin at cutover)
RECOVERY_FEE_PERCENT = "9"
RECOVERY_FEE_EXEMPTION_SATS = "10000"
ELECTRS_API_BASE = "https://api.counterparty.io:3000"
# RECOVERY_FEE_ADDRESSES is a Worker secret; it is intentionally not stored here.
# ADMIN_TOKEN is a Cloudflare secret (wrangler secret put ADMIN_TOKEN) — not stored in the repo.
