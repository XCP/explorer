name = "xcp-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
minify = true
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.xcp.io/*", zone_name = "xcp.io" }]

[observability]
enabled = true
head_sampling_rate = 0.01

[limits]
cpu_ms = 300000

# Observe-only public API budget. The Worker logs threshold crossings but does
# not return 429 yet; enforcement waits for measured route-family distributions.
[[ratelimits]]
name = "PUBLIC_API_RATE_LIMITER"
namespace_id = "20260721"

  [ratelimits.simple]
  limit = 600
  period = 60

[triggers]
crons = ["*/2 * * * *", "1-59/2 * * * *"]

# Canonical Counterparty database.
[[d1_databases]]
binding = "CORE_DB"
database_name = "xcpio-core"
database_id = "17b7d589-7076-4ea1-851a-0de10964ab16"
migrations_dir = "migrations-core"

# Counterparty bare-multisig recovery index. Isolated because its source is the
# Bitcoin chain, it is independently rebuildable, and the main D1 is near its cap.
[[d1_databases]]
binding = "RECOVERY_DB"
database_name = "xcpio-btc"
database_id = "9bc7626d-df95-49d2-a118-274cd1b34b2f"
migrations_dir = "migrations-recovery"

[[r2_buckets]]
binding = "RECOVERY_TRANSACTIONS"
bucket_name = "xcpio-bitcoin-transactions"

# worker-to-worker (avoids the workers.dev sibling-fetch issue) for swap market data
[[services]]
binding = "XCPDEX"
service = "xcpdex-api"

[vars]
COUNTERPARTY_API_BASE = "https://api.counterparty.io:4000/v2"
XCPDEX_API = "https://xcpdex-api.me-bbe.workers.dev"
RECOVERY_FEE_PERCENT = "9"
RECOVERY_FEE_EXEMPTION_SATS = "10000"
ELECTRS_API_BASE = "https://api.counterparty.io:3000"
# RECOVERY_FEE_XPUB is a Worker secret (wrangler secret put RECOVERY_FEE_XPUB): the account-level
# BIP86 xpub (m/86'/0'/0') recovery fees derive into. Public key only — never a seed or xprv.
# RECOVERY_FEE_ADDRESSES is the legacy static list, also a secret; it stays honoured for reports
# during cutover and can be deleted once no recovery built against it can still be in flight.
# ADMIN_TOKEN is a Cloudflare secret (wrangler secret put ADMIN_TOKEN) — not stored in the repo.
