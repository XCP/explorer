name = "xcp-web"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# Production host patterns are exact: API and CDN subdomains are untouched. `www` stays attached
# only as ingress for the zone-level canonical redirect, which runs before this Worker.
routes = [
  { pattern = "xcp.io/*", zone_name = "xcp.io" },
  { pattern = "www.xcp.io/*", zone_name = "xcp.io" },
]
# Do not expose an alternate hostname that bypasses zone WAF, redirects, and rate controls.
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_BASE = "https://api.xcp.io"

[observability]
enabled = true
head_sampling_rate = 0.01

# Server components can't fetch a sibling worker's public workers.dev URL from inside Cloudflare
# (same issue the API works around for xcpdex) — server-side reads go through this binding.
[[services]]
binding = "API_WORKER"
service = "xcp-api"

# OpenNext incremental cache (ISR / Next Data Cache) — persists `revalidate` fetches so SSR reads hit this
# bucket instead of re-querying D1 cold on every request. Binding name is fixed by r2IncrementalCache.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "xcp-web-inc-cache"
