name = "xcp-web"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# The production domain. Without these routes the worker lives only on workers.dev and the zone's
# proxied apex/www records dead-end in Cloudflare's 403 (this is why xcp.io was down while
# xcp-web.me-bbe.workers.dev worked). Host patterns are exact: api.* and cdn.* routes are untouched.
# Zone routes attach non-interactively; they serve the moment the zone's apex/www DNS records are
# valid proxied records (e.g. A 192.0.2.1). The legacy records currently dead-end in a Cloudflare
# 403 BEFORE routing — fixing those two records in the dashboard is the one manual step. (Custom
# Domains would manage DNS for us but their override confirmation breaks non-interactive deploys.)
routes = [
  { pattern = "xcp.io/*", zone_name = "xcp.io" },
  { pattern = "www.xcp.io/*", zone_name = "xcp.io" },
]
# Keep the workers.dev origin alive alongside the routes (wrangler disables it by default once
# routes exist) — it's the deploy-verification origin and the API base the web client points at.
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_BASE = "https://xcp-api.me-bbe.workers.dev"

# Server components can't fetch a sibling worker's public workers.dev URL from inside Cloudflare
# (same issue the API works around for xcpdex) — server-side reads go through this binding.
[[services]]
binding = "API_WORKER"
service = "xcp-api"

# OpenNext incremental cache (ISR / Next Data Cache) — persists `revalidate` fetches so SSR reads hit this
# bucket instead of re-querying D1 cold on every request. Binding name is fixed by r2IncrementalCache.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "xcp-web-inc-cache"
