name = "xcp-web"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_BASE = "https://xcp-api.me-bbe.workers.dev"

# Server components can't fetch a sibling worker's public workers.dev URL from inside Cloudflare
# (same issue the API works around for xcpdex) — server-side reads go through this binding.
[[services]]
binding = "API_WORKER"
service = "xcp-api"
