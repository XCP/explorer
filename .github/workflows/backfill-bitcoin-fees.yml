name: Backfill Bitcoin fees

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: bitcoin-fee-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Advance authoritative Bitcoin fees
        working-directory: apps/api
        env:
          ADMIN_TOKEN: ${{ secrets.XCPIO_ADMIN_TOKEN }}
        run: >-
          node ops/backfill-bitcoin-fees.mjs
          --page-size=500
          --concurrency=4
          --request-delay-ms=100
          --max-pages=250
