name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -w xcp-api
      - name: Bundle API Worker
        working-directory: apps/api
        run: |
          npx wrangler deploy --dry-run --outdir .dry-run
          node ../../scripts/check-bundle-size.mjs .dry-run/index.js 716800

  web-deployment-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w xcp-explorer-web
      - name: Build OpenNext Worker
        working-directory: apps/web
        run: npx opennextjs-cloudflare build
