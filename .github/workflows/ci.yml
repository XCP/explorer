name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -w xcpdex-api

  web-deployment-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w xcp-explorer-web
      - name: Check generated Cloudflare binding types
        working-directory: apps/web
        run: npx wrangler types --env-interface CloudflareEnv --include-runtime=false --check worker-configuration.d.ts
      - run: npm run build -w xcp-explorer-web
      - name: Build OpenNext Worker
        working-directory: apps/web
        run: npx opennextjs-cloudflare build --skipNextBuild
