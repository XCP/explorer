name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -w xcp-api
      - name: Bundle API Worker
        working-directory: apps/api
        run: |
          npx wrangler deploy --dry-run --outdir .dry-run
          # 768 KiB. Raised from 700 because main had already outgrown it:
          # 737.9 KiB at 8e7b16d, with no PR able to go green since. The same
          # thing happened at 600 and the answer was the same. Compressed the
          # worker is 191 KiB, which is nowhere near a platform limit, so this
          # is a discipline guard rather than a hard ceiling -- but it only
          # works as one if it is honest about where the worker actually is.
          node ../../scripts/check-bundle-size.mjs .dry-run/index.js 786432

  web-deployment-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w xcp-explorer-web
      - name: Build OpenNext Worker
        working-directory: apps/web
        run: npx opennextjs-cloudflare build
